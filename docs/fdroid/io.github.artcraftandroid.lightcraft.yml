Categories:
  - Graphics
License: MIT
AuthorName: artcraft-android
SourceCode: https://github.com/artcraft-android/lightcraft-android
IssueTracker: https://github.com/artcraft-android/lightcraft-android/issues
Changelog: https://github.com/artcraft-android/lightcraft-android/releases

AutoName: LightCraft

RepoType: git
Repo: https://github.com/artcraft-android/lightcraft-android.git

Builds:
  - versionName: 0.0.3-beta
    versionCode: 3011
    commit: TAG_COMMIT_SHA
    subdir: apps/lightcraft-android/android/app
    sudo:
      - apt-get update
      - apt-get install -y gcc libc-dev rustup
    gradle:
      - yes
    output: build/outputs/apk/release/app-release-unsigned.apk
    binary: https://github.com/artcraft-android/lightcraft-android/releases/download/v%v/lightcraft-android-%v-armeabi-v7a.apk
    prebuild:
      - rustup toolchain install $(sed -n -E 's/^channel = "(.*)"/\1/p' ../../../../rust-toolchain.toml)
        --profile minimal --target armv7-linux-androideabi
      - cargo install --locked --version $(sed -n -E 's/.*cargo install cargo-ndk
        --version ([0-9.]+).*/\1/p' ../../../../.github/workflows/release.yml) cargo-ndk
    ndk: 29.0.14206865
    gradleprops:
      - lightcraft.abis=armeabi-v7a
      - lightcraft.unsigned=true

  - versionName: 0.0.3-beta
    versionCode: 3012
    commit: TAG_COMMIT_SHA
    subdir: apps/lightcraft-android/android/app
    sudo:
      - apt-get update
      - apt-get install -y gcc libc-dev rustup
    gradle:
      - yes
    output: build/outputs/apk/release/app-release-unsigned.apk
    binary: https://github.com/artcraft-android/lightcraft-android/releases/download/v%v/lightcraft-android-%v.apk
    prebuild:
      - rustup toolchain install $(sed -n -E 's/^channel = "(.*)"/\1/p' ../../../../rust-toolchain.toml)
        --profile minimal --target aarch64-linux-android
      - cargo install --locked --version $(sed -n -E 's/.*cargo install cargo-ndk
        --version ([0-9.]+).*/\1/p' ../../../../.github/workflows/release.yml) cargo-ndk
    ndk: 29.0.14206865
    gradleprops:
      - lightcraft.abis=arm64-v8a
      - lightcraft.unsigned=true

AllowedAPKSigningKeys: 7356d58ae3446b3e6cc457d0b9901700376c787310c9dba14e9c11866588eeb5

