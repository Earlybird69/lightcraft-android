AutoName: LightCraft

RepoType: git
Repo: https://github.com/artcraft-android/lightcraft-android.git

Builds:
  - versionName: 0.0.3-beta
    versionCode: 3011
    commit: TAG_COMMIT_SHA
    subdir: apps/lightcraft-android/android/app
    sudo:
      - apt-get update
      - apt-get install -y build-essential
    gradle:
      - yes
    binary: https://github.com/artcraft-android/lightcraft-android/releases/download/v%v/lightcraft-android-%v-armeabi-v7a.apk
    srclibs:
      - rustup@1.28.2
    prebuild:
      - bash $$rustup$$/rustup-init.sh -y --default-toolchain none --profile minimal
      - source $HOME/.cargo/env
      - rustup toolchain install
      - cargo install cargo-ndk --version 4.1.2 --locked
    ndk: 29.0.14206865
    gradleprops:
      - lightcraft.abis=armeabi-v7a
      - lightcraft.unsigned=true

  - versionName: 0.0.3-beta
    versionCode: 3012
